[project]
name = "habit_tracker_system"
version = "0.1.0"
description = "habit_tracker_system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.22,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habit_tracker_system"]

[tool.crewai]
type = "flow"
definition = "src/habit_tracker_system/flow.json"
project_id = "03864439-59fa-49bc-8a08-f49571dc2862"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
