analyze_performance_task:
  description: >
    Analyze the user log history for habit ID {habit_id}. Calculate the current completion rate, 
    evaluate the ratio of DONE vs SKIPPED vs PENDING states, and summarize streak health.
  expected_output: >
    A concise statistical summary containing completion percentage, current streak status, 
    and a burnout risk score (Low, Medium, High).
  agent: analytics_strategist

generate_coaching_plan_task:
  description: >
    Using the metrics generated by the Analytics Strategist, create a tailored, empathetic coaching recommendation 
    for the user to keep their streak alive tomorrow.
  expected_output: >
    A 3-bullet action plan with clear, encouragement-driven steps tailored to the recent log state.
  agent: habit_coach

